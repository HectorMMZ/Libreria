<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion</title>

     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styleInicioDeSesion.css">

    <!-- Css global -->
    <link rel="stylesheet" href="global.css">

    <!-- Y CON ESTO SE PUEDO "VER" LOS ICONOS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- ---------------------------- -->
     
</head>
<body>

   <div class="ColorBarraDeActividades">
        <div class="BarraDeActividadesMargen">
               <div class="FilaSuperior">
                    <div class="LogoYTitulo">
                        <img src="LechuzaLogo.png" class="logo">
                        <a>    
                            <h3 style="color: white"> Libreria <br> Quimera</h3>
                        </a>
                    </div>

                    <div class="BuscadorHeader">
                        <form>
                            <input type="search" name="q" placeholder="Título, Autor o ISBN">
                            <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                        </form>
                    </div>

                    <div class="AccionesUsuario">
                        <a href="usuario.html" class="BotonUsuario">
                            <i class="fa-solid fa-user"> </i> <span style="margin-left: 10px;">Mi cuenta</span>
                        </a>

                        <a href="carrito.html" class="BotonCarro">
                            <i class="fa-solid fa-cart-arrow-down"> </i> <span style="margin-left: 10px;">Mis Libros</span>
                        </a>
                    </div>
                </div>

                <div class="FilaInferior">
                    <nav class="BarraDeActividades">
                        <a href="index.html">Inicio</a>
                        <a href="ofertas.html" style="color: rgb(188, 2, 2);"><strong>¡Ofertas!</strong></a>
                        <a href="catalogo.html">Catalogo</a>
                        <a href="novedades.html">Novedades</a>
                        <a href="conocenosmas.html">Conocenos Mas</a>
                    </nav>
                </div>
        </div>
    </div>  

    <div class="CuerpoDelInicioDeSesion">
        <div class="Contenido">
            <div class="Registro" id="Registro">

                <div class="Formato InicioDeSesion">
                    <h2>Iniciar sesion</h2>
                    
                    <input type="email" placeholder="Correo">
                    <input type="password" placeholder="Contraseña">
                    
                    <button class="ingresar">Ingresar</button>
                    
                    <p>¿Aun no tienes cuenta?
                        <span id="Registrate">Registrate</span>
                    </p>
                </div>

                <div class="Formato NuevaCuenta">
                    <h2>Registra</h2>
                    
                    <input type="text" placeholder="Primer Nombre">
                    <input type="text" placeholder="Segundo Nombre">
                    <input type="email" placeholder="Correo">
                    <input type="password" placeholder="Contraseña">
                    <input type="tel" placeholder="Numero Telefonico">
                    
                    <button class="crear-cuenta">Crear cuenta</button>
                    
                    <p>¿Todo listo?
                        <span id="RegistroNuevo">Iniciar sesion</span>
                    </p>
                </div>

            </div>
        </div>
</div>
        <script src="scriptIniciarSesion.js"></script>

    
</body>
</html>
