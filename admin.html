<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Librería Quimera</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="styleadmin.css">
</head>
<body>
    <header class="admin-header">
        <h1>Panel de Administración - Librería Quimera</h1>
        <nav>
            <a href="index.html" class="btn-volver">Volver a la Tienda</a>
        </nav>
    </header>

    <main class="admin-container">
        <!-- Pestañas de navegación interna -->
        <div class="tabs">
            <button class="tab-btn active" onclick="mostrarSeccion('inventario')">Inventario de Libros</button>
            <button class="tab-btn" onclick="mostrarSeccion('pedidos')">Pedidos</button>
            <button class="tab-btn" onclick="mostrarSeccion('mensajes')">Mensajes de Contacto</button>
        </div>

        <!-- SECCIÓN 1: INVENTARIO -->
        <section id="sec-inventario" class="admin-section active">
            <h2>Gestión de Libros</h2>
            <form id="form-libro" class="admin-form">
                <input type="hidden" id="libro-id">
                <input type="text" id="libro-titulo" placeholder="Título del libro" required>
                <input type="text" id="libro-autor" placeholder="Autor" required>
                <input type="number" step="0.01" id="libro-precio" placeholder="Precio ($)" required>
                <input type="number" id="libro-stock" placeholder="Stock disponible" required>
                <input type="text" id="libro-imagen" placeholder="Ruta imagen (ej. img/libro.jpg)">
                <select id="libro-categoria" required>
                    <option value="">Selecciona una categoría...</option>
                </select>
                <div class="form-botones">
                    <button type="submit" id="btn-guardar" class="btn-verde">Guardar Libro</button>
                    <button type="button" id="btn-cancelar" class="btn-gris" style="display:none;" onclick="limpiarFormulario()">Cancelar Edición</button>
                </div>
            </form>

            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-libros"></tbody>
            </table>
        </section>

        <!-- SECCIÓN 2: PEDIDOS -->
        <section id="sec-pedidos" class="admin-section">
            <h2>Historial de Pedidos</h2>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID Pedido</th>
                        <th>Cliente</th>
                        <th>Fecha</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="tabla-pedidos"></tbody>
            </table>
        </section>

        <!-- SECCIÓN 3: MENSAJES -->
        <section id="sec-mensajes" class="admin-section">
            <h2>Buzón de Contacto</h2>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Mensaje</th>
                    </tr>
                </thead>
                <tbody id="tabla-mensajes"></tbody>
            </table>
        </section>
    </main>

    <script src="scriptAdmin.js"></script>
</body>
</html>
