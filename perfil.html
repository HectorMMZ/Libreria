<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Libreria Quimera</title>

    <!-- Fuentes y Estilos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="stylecatalogo.css">

    <!-- Iconos FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- ==========================================
         BARRA DE NAVEGACIÓN (Intacta)
         ========================================== -->
    <div class="ColorBarraDeActividades">
        <div class="BarraDeActividadesMargen">
                <div class="FilaSuperior">
                    <div class="LogoYTitulo">
                        <img src="LechuzaLogo.png" class="logo" alt="Logo">
                        <a href="index.html">    
                            <h3 style="color: white"> Libreria <br> Quimera</h3>
                        </a>
                    </div>

                    <div class="BuscadorHeader">
                        <form>
                            <input type="search" name="q" placeholder="Título, Autor o ISBN">
                            <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                        </form>
                    </div>

                    <div class="AccionesUsuario">
                        <a href="perfil.html" class="BotonUsuario">
                            <i class="fa-solid fa-user"> </i> <span style="margin-left: 10px;">Hola, Eduard</span>
                        </a>

                        <a href="carrito.html" class="BotonCarro">
                            <i class="fa-solid fa-cart-arrow-down"> </i> <span style="margin-left: 10px;">Carrito </span> <span id="numerito" class="numerito"> 0 </span>
                        </a>
                    </div>
                </div>

                <div class="FilaInferior">
                    <nav class="BarraDeActividades">
                        <a href="index.html">Inicio</a>
                        <a href="ofertas.html" style="color: rgb(188, 2, 2);"><strong>¡Ofertas!</strong></a>
                        <a href="catalogo.html">Catalogo</a>
                        <a href="novedades.html">Novedades</a>
                        <a href="contacto.html">Contacto</a>
                    </nav>
                </div>
        </div>
    </div> 
    <!-- ==========================================
         ZONA DE PERFIL (Refactorizada)
         ========================================== -->
    <div class="ContenedorPerfil">
        
        <div class="CabeceraPerfil">
            <i class="fa-solid fa-circle-user IconoPerfil"></i>
            <h2 id="saludoPerfil">Mi Perfil</h2>
        </div>

        <!-- Tarjeta de Contraseña -->
        <div class="TarjetaPerfil">
            <h3><i class="fa-solid fa-lock"></i> Cambiar Contraseña</h3>
            <div class="GrupoInput">
                <input type="password" id="nuevaPassword" placeholder="Escribe tu nueva contraseña">
            </div>
            <button id="btnCambiarPass" class="BotonPerfil Primario">Actualizar Contraseña</button>
        </div>

        <!-- Tarjeta de Peligro -->
        <div class="TarjetaPerfil Peligro">
            <h3><i class="fa-solid fa-triangle-exclamation"></i> Eliminar Cuenta</h3>
            <p>Para eliminar tu cuenta para siempre, por favor confirma tu contraseña actual.</p>
            <div class="GrupoInput">
                <input type="password" id="passEliminar" placeholder="Escribe tu contraseña">
            </div>
            <button id="btnEliminarCuenta" class="BotonPerfil Secundario">Eliminar mi cuenta</button>
        </div>
        <!-- Botón de Cerrar Sesión -->
        <button id="btnCerrarSesion" class="BotonCerrarSesion">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar Sesión
        </button>
    </div>
    <!-- Scripts -->
    <script src="scriptPerfil.js"></script>
    <script src="scriptBarRebelde.js"></script>
</body>
</html>
