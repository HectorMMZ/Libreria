<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Libreria Quimera</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="global.css">

    <link rel="stylesheet" href="stylecatalogo.css">


       <!-- Y CON ESTO SE PUEDO "VER" EL ICONO DEL CARRO -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- ---------------------------- -->
</head>
<body>

    <div class="ColorBarraDeActividades">
        <div class="BarraDeActividadesMargen">
                <div class="FilaSuperior">
                    <div class="LogoYTitulo">
                        <img src="LechuzaLogo.png" class="logo">
                        <a>    
                            <h3 style="color: white"> Libreria <br> Quimera</h3>
                        </a>
                    </div>

                    <div class="BuscadorHeader">
                        <form>
                            <input type="search" name="q" placeholder="Título, Autor o ISBN">
                            <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                        </form>
                    </div>

                    <div class="AccionesUsuario">
                        <a href="usuario.html" class="BotonUsuario">
                            <i class="fa-solid fa-user"> </i> <span style="margin-left: 10px;">Mi cuenta</span>
                        </a>

                        <a href="carrito.html" class="BotonCarro">
                            <i class="fa-solid fa-cart-arrow-down"> </i> <span style="margin-left: 10px;">Carrito </span> <span id="numerito" class="numerito"> 0 </strong> </span>
                            
                        </a>
                    </div>
                </div>

                <div class="FilaInferior">
                    <nav class="BarraDeActividades">
                        <a href="index.html">Inicio</a>
                        <a href="ofertas.html" style="color: rgb(188, 2, 2);"><strong>¡Ofertas!</strong></a>
                        <a href="catalogo.html">Catalogo</a>
                        <a href="novedades.html">Novedades</a>
                        <a href="contacto.html">Contacto</a>
                    </nav>
                </div>
        </div>
    </div> 

        <div style="text-align: center; margin-top: 50px;">
        <h2 id="saludoPerfil">Mi Perfil</h2>
        
        <div style="margin: 30px auto; max-width: 400px; padding: 20px; border: 1px solid #ccc;">
            <h3>Cambiar Contraseña</h3>
            <input type="password" id="nuevaPassword" placeholder="Escribe tu nueva contraseña" style="margin-bottom: 15px; width: 100%;"><br>
            <button id="btnCambiarPass" style="background-color: #505839; color: white; padding: 10px;">Actualizar Contraseña</button>
        </div>

        <button id="btnCerrarSesion" style="background-color: #bc0202; color: white; padding: 10px; margin-top: 20px;">Cerrar Sesión</button>
    </div>

        <hr style="margin: 30px 0; border: 1px solid #ddd;">
    
    <div style="margin: 30px auto; max-width: 400px; padding: 20px; border: 1px solid #ffcccc; background-color: #fff0f0;">
        <h3 style="color: #bc0202; margin-top: 0;">Zona de Peligro: Eliminar Cuenta</h3>
        <p style="font-size: 14px; color: #555;">Para eliminar tu cuenta, por favor confirma tu contraseña actual.</p>
        
        <input type="password" id="passEliminar" placeholder="Escribe tu contraseña" style="margin-bottom: 15px; width: 90%; padding: 8px;">
        <br>
        <button id="btnEliminarCuenta" style="background-color: #bc0202; color: white; padding: 10px; width: 95%; border: none; cursor: pointer; font-weight: bold;">
            Eliminar mi cuenta para siempre
        </button>
    </div>

        <script src="scriptPerfil.js"></script>
        <script src="scriptBarRebelde.js"></script>

</body>
</html>
