<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de envío - Libreria Quimera</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="stylecatalogo.css">

    <!-- Iconos FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- ==========================================
         BARRA DE NAVEGACIÓN (Intacta)
         ========================================== -->
    <div class="ColorBarraDeActividades">
        <div class="BarraDeActividadesMargen">
                <div class="FilaSuperior">
                    <div class="LogoYTitulo">
                        <img src="LechuzaLogo.png" class="logo" alt="Logo">
                        <a href="index.html">    
                            <h3 style="color: white"> Libreria <br> Quimera</h3>
                        </a>
                    </div>

                    <div class="BuscadorHeader">
                        <form>
                            <input type="search" name="q" placeholder="Título, Autor o ISBN">
                            <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                        </form>
                    </div>

                    <div class="AccionesUsuario">
                        <a href="usuario.html" class="BotonUsuario">
                            <i class="fa-solid fa-user"> </i> <span style="margin-left: 10px;">Mi cuenta</span>
                        </a>

                        <a href="carrito.html" class="BotonCarro">
                            <i class="fa-solid fa-cart-arrow-down"> </i> <span style="margin-left: 10px;">Carrito </span> <span id="numerito" class="numerito"> 0 </span>
                        </a>
                    </div>
                </div>

                <div class="FilaInferior">
                    <nav class="BarraDeActividades">
                        <a href="index.html">Inicio</a>
                        <a href="ofertas.html" style="color: rgb(188, 2, 2);"><strong>¡Ofertas!</strong></a>
                        <a href="catalogo.html">Catalogo</a>
                        <a href="novedades.html">Novedades</a>
                        <a href="contacto.html">Contacto</a>
                    </nav>
                </div>
        </div>
    </div> 

    <!-- ==========================================
         ZONA DE ENVÍO (Refactorizada con el estilo del Perfil)
         ========================================== -->
    <div class="ContenedorPerfil">
        
        <div class="CabeceraPerfil">
            <!-- Icono de camión de envío -->
            <i class="fa-solid fa-truck-fast IconoPerfil"></i>
            <h2>Datos de Envío</h2>
        </div>

        <div class="TarjetaPerfil">
            
            <!-- Resumen de pago destacado -->
            <div style="text-align: center; border-bottom: 2px dashed #EAEAEA; padding-bottom: 20px; margin-bottom: 25px;">
                <h3 style="color: #c9302c; font-size: 1.8rem; margin: 0;" id="totalEnvio">Total a pagar: $0.00</h3>
                <p style="color: #666; margin: 10px 0 0 0;">Por favor, llena tus datos para procesar el pedido.</p>
            </div>

            <!-- Formulario limpio -->
            <form id="formEnvio">
                
                <div class="GrupoInput">
                    <label><i class="fa-solid fa-location-dot"></i> Dirección completa:</label>
                    <input type="text" id="direccion" placeholder="Ej. Calle Pino 123" required>
                </div>

                <div class="GrupoInput">
                    <label><i class="fa-solid fa-city"></i> Ciudad:</label>
                    <input type="text" id="ciudad" placeholder="Tu ciudad" required>
                </div>

                <div class="GrupoInput">
                    <label><i class="fa-solid fa-envelopes-bulk"></i> Código Postal:</label>
                    <input type="text" id="codigo_postal" placeholder="Ej. 24000" required>
                </div>

                <div class="GrupoInput">
                    <label><i class="fa-solid fa-phone"></i> Teléfono:</label>
                    <input type="text" id="telefono_envio" placeholder="A 10 dígitos" required>
                </div>
                
                <button type="submit" class="BotonPerfil Primario" style="margin-top: 15px;">
                    <i class="fa-solid fa-check-circle"></i> Finalizar Compra
                </button>
                
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="scriptNavbar.js"></script>
    <script src="scriptEnvio.js"></script>

</body>
</html>
