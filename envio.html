<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de envio - Libreria Quimera</title>

      <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="global.css">

    <link rel="stylesheet" href="stylecatalogo.css">


       <!-- Y CON ESTO SE PUEDO "VER" EL ICONO DEL CARRO -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- ---------------------------- -->
</head>
<body>

    <div class="ColorBarraDeActividades">
        <div class="BarraDeActividadesMargen">
                <div class="FilaSuperior">
                    <div class="LogoYTitulo">
                        <img src="LechuzaLogo.png" class="logo">
                        <a>    
                            <h3 style="color: white"> Libreria <br> Quimera</h3>
                        </a>
                    </div>

                    <div class="BuscadorHeader">
                        <form>
                            <input type="search" name="q" placeholder="Título, Autor o ISBN">
                            <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                        </form>
                    </div>

                    <div class="AccionesUsuario">
                        <a href="usuario.html" class="BotonUsuario">
                            <i class="fa-solid fa-user"> </i> <span style="margin-left: 10px;">Mi cuenta</span>
                        </a>

                        <a href="carrito.html" class="BotonCarro">
                            <i class="fa-solid fa-cart-arrow-down"> </i> <span style="margin-left: 10px;">Carrito </span> <span id="numerito" class="numerito"> 0 </strong> </span>
                            
                        </a>
                    </div>
                </div>

                <div class="FilaInferior">
                    <nav class="BarraDeActividades">
                        <a href="index.html">Inicio</a>
                        <a href="ofertas.html" style="color: rgb(188, 2, 2);"><strong>¡Ofertas!</strong></a>
                        <a href="catalogo.html">Catalogo</a>
                        <a href="novedades.html">Novedades</a>
                        <a href="contacto.html">Contacto</a>
                    </nav>
                </div>
        </div>
    </div> 


    <div style="max-width: 500px; margin: 0 auto;">
        
        <h2>Datos de Envío</h2>
        <hr>

        <h3 style="color: #c9302c;" id="totalEnvio">Total a pagar: $0.00</h3>
        <p>Por favor, llena tus datos para procesar el pedido:</p>

        <form id="formEnvio" style="display: flex; flex-direction: column; gap: 15px;">
            
            <div>
                <label><b>Dirección completa:</b></label><br>
                <input type="text" id="direccion" placeholder="Ej. Calle Pino 123" required style="width: 100%; padding: 8px;">
            </div>

            <div>
                <label><b>Ciudad:</b></label><br>
                <input type="text" id="ciudad" placeholder="Tu ciudad" required style="width: 100%; padding: 8px;">
            </div>

            <div>
                <label><b>Código Postal:</b></label><br>
                <input type="text" id="codigo_postal" placeholder="Ej. 24000" required style="width: 100%; padding: 8px;">
            </div>

            <div>
                <label><b>Teléfono:</b></label><br>
                <input type="text" id="telefono_envio" placeholder="A 10 dígitos" required style="width: 100%; padding: 8px;">
            </div>
            
            <button type="submit" style="background-color: #505839; color: white; padding: 12px; font-weight: bold; border: none; cursor: pointer; margin-top: 10px;">
                Finalizar Compra
            </button>
            
        </form>
    </div>

    <script src="scriptNavbar.js"></script>
    <script src="scriptEnvio.js"></script>

</body>
</html>
